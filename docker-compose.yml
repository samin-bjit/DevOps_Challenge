  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # target: builder
    environment:
      - NODE_ENV=production
      - REACT_APP_API_URL=/backend
    networks:
      - app-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      # - DB_HOST=mysql-master
      # - DB_DATABASE=${DB_DATABASE}
      # - DB_USERNAME=${DB_USERNAME}
      # - DB_PASSWORD=${DB_PASSWORD}
