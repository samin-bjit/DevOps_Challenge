version: '3.8'

services:
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend
      - backend
    volumes:
      - ./nginx/logs:/var/log/nginx
    container_name: app-nginx
    # networks:
    #   - app-network
    
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production  # Specify the target stage
      cache_from:
        - node:18-alpine
    environment:
      - NODE_ENV=${NODE_ENV}
      - REACT_APP_API_HOST=${REACT_APP_API_HOST}
    ports:
      - "3000:80"
    # networks:
    #   - app-network
    container_name: app-frontend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
        - MYSQL_USER=${MYSQL_USER}
        - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    environment:
      - APP_ENV=${APP_ENV}
      - APP_DEBUG=${APP_DEBUG}
      - APP_KEY=${APP_KEY}
      - APP_URL=${APP_URL}
      - APP_NAME=${APP_NAME}
      - APP_TIMEZONE=${APP_TIMEZONE}
      - LOG_CHANNEL=${LOG_CHANNEL}
      - LOG_SLACK_WEBHOOK_URL=${LOG_SLACK_WEBHOOK_URL}
      - DB_CONNECTION=${DB_CONNECTION}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
    depends_on:
      - mysql-master
    ports:
      - "8000:8000"
    # networks:
    #   - app-network
    container_name: app-backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://backend:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  mysql-master:
    build:
      context: ./mysql
      dockerfile: Dockerfile
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - ./mysql_master_data:/var/lib/mysql
    # networks:
    #   - app-network
    container_name: app-mysql-master
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost"]
      interval: 30s
      timeout: 10s
      retries: 3

